<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>芝麻日历 - 下载</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: rgba(17, 17, 17, 0.92);
        --muted: rgba(17, 17, 17, 0.6);
        --primary: #3d6afb;
        --card: rgba(17, 17, 17, 0.04);
        --shadow: 0 10px 26px rgba(17, 17, 17, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }

      .page {
        min-height: 100%;
        padding: 22px 18px calc(22px + env(safe-area-inset-bottom));
        max-width: 520px;
        margin: 0 auto;
      }

      .hero {
        margin-top: 8px;
        padding: 20px 18px 16px;
        border-radius: 18px;
        background: radial-gradient(circle at 30% 20%, rgba(61, 106, 251, 0.18) 0%, rgba(61, 106, 251, 0) 60%),
          radial-gradient(circle at 70% 0%, rgba(255, 176, 32, 0.12) 0%, rgba(255, 176, 32, 0) 55%),
          rgba(17, 17, 17, 0.02);
      }

      .app-name {
        font-size: 22px;
        font-weight: 900;
        line-height: 1.2;
        margin: 0;
      }

      .subtitle {
        margin: 10px 0 0;
        font-size: 14px;
        line-height: 1.5;
        font-weight: 650;
        color: var(--muted);
        word-break: break-word;
      }

      .card {
        margin-top: 14px;
        padding: 16px 16px;
        background: var(--card);
        border-radius: 16px;
        box-shadow: var(--shadow);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .label {
        font-size: 14px;
        font-weight: 800;
        color: rgba(17, 17, 17, 0.78);
      }

      .value {
        font-size: 13px;
        font-weight: 700;
        color: rgba(17, 17, 17, 0.6);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 65%;
      }

      .btn {
        margin-top: 14px;
        height: 50px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-size: 16px;
        font-weight: 900;
        cursor: pointer;
      }

      .btn-primary {
        background: var(--primary);
        color: #fff;
      }

      .btn-ghost {
        background: rgba(61, 106, 251, 0.12);
        color: var(--primary);
      }

      .btn-disabled {
        background: rgba(17, 17, 17, 0.12);
        color: rgba(17, 17, 17, 0.4);
        cursor: not-allowed;
      }

      .hint {
        margin-top: 12px;
        font-size: 13px;
        font-weight: 650;
        color: rgba(17, 17, 17, 0.55);
        line-height: 1.5;
        word-break: break-word;
      }

      .mask {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        padding: 18px;
        z-index: 9999;
      }

      .mask-card {
        margin: 0 auto;
        max-width: 520px;
        background: #fff;
        border-radius: 18px;
        padding: 18px 16px;
        box-shadow: 0 18px 40px rgba(17, 17, 17, 0.18);
      }

      .mask-title {
        font-size: 18px;
        font-weight: 900;
        margin: 0;
      }

      .mask-desc {
        margin: 10px 0 0;
        font-size: 14px;
        font-weight: 650;
        color: rgba(17, 17, 17, 0.68);
        line-height: 1.55;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(24px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(17, 17, 17, 0.88);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        display: none;
        z-index: 10000;
        max-width: calc(100% - 36px);
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="hero">
        <h1 class="app-name">芝麻日历</h1>
        <p class="subtitle" id="subtitle">正在获取下载地址…</p>
      </div>

      <div class="card">
        <div class="row">
          <div class="label">下载链接</div>
          <div class="value" id="downloadUrlText">—</div>
        </div>
      </div>

      <div class="btn btn-primary btn-disabled" id="downloadBtn">立即下载</div>
      <div class="btn btn-ghost btn-disabled" id="copyBtn">复制下载链接</div>

      <div class="hint" id="hint">
        如无法直接下载，请复制下载链接后在系统浏览器打开。
      </div>
    </div>

    <div class="mask" id="wechatMask">
      <div class="mask-card">
        <h2 class="mask-title">请在浏览器打开</h2>
        <p class="mask-desc">
          微信内可能无法直接下载应用。请点击右上角菜单，选择“在浏览器打开”，再进行下载。
        </p>
        <div class="btn btn-primary" id="maskCopyBtn">复制下载链接</div>
        <div class="btn btn-ghost" id="maskCloseBtn">我知道了</div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const elSubtitle = document.getElementById('subtitle')
      const elDownloadUrlText = document.getElementById('downloadUrlText')
      const elDownloadBtn = document.getElementById('downloadBtn')
      const elCopyBtn = document.getElementById('copyBtn')
      const elToast = document.getElementById('toast')
      const elWechatMask = document.getElementById('wechatMask')
      const elMaskCopyBtn = document.getElementById('maskCopyBtn')
      const elMaskCloseBtn = document.getElementById('maskCloseBtn')

      function ua() {
        return navigator.userAgent || ''
      }

      function isWechat() {
        return /MicroMessenger/i.test(ua())
      }

      function isIOS() {
        return /iPhone|iPad|iPod/i.test(ua())
      }

      function showToast(text) {
        elToast.textContent = String(text || '')
        elToast.style.display = 'block'
        setTimeout(() => {
          elToast.style.display = 'none'
        }, 1400)
      }

      function setButtonEnabled(el, enabled) {
        const cls = 'btn-disabled'
        if (enabled) el.classList.remove(cls)
        else el.classList.add(cls)
      }

      function safeText(v) {
        const s = String(v || '').trim()
        return s
      }

      function extractDownloadUrl(payload) {
        if (!payload) return ''
        if (typeof payload === 'string') return safeText(payload)
        if (typeof payload !== 'object') return ''
        const data = payload.data && typeof payload.data === 'object' ? payload.data : payload
        return safeText(data.downloadUrl || data.downloadurl || data.url || '')
      }

      async function fetchDownloadUrl() {
        try {
          const res = await fetch('/calendar/app/getAppVersion', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
            body: '',
          })
          const ct = res.headers.get('content-type') || ''
          if (ct.includes('application/json')) {
            const json = await res.json()
            return extractDownloadUrl(json)
          }
          const text = await res.text()
          try {
            const json = JSON.parse(text)
            return extractDownloadUrl(json)
          } catch (e) {
            return extractDownloadUrl(text)
          }
        } catch (e) {
          return ''
        }
      }

      async function copyText(text) {
        const v = safeText(text)
        if (!v) return false
        try {
          if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            await navigator.clipboard.writeText(v)
            return true
          }
        } catch (e) {}
        try {
          const input = document.createElement('input')
          input.value = v
          document.body.appendChild(input)
          input.select()
          input.setSelectionRange(0, input.value.length)
          const ok = document.execCommand('copy')
          document.body.removeChild(input)
          return !!ok
        } catch (e) {
          return false
        }
      }

      function openUrl(url) {
        const target = safeText(url)
        if (!target) return
        location.href = target
      }

      function shortText(url) {
        const v = safeText(url)
        if (v.length <= 26) return v
        return `${v.slice(0, 18)}…${v.slice(-6)}`
      }

      let downloadUrl = ''

      function render() {
        elDownloadUrlText.textContent = downloadUrl ? shortText(downloadUrl) : '—'
        elSubtitle.textContent = downloadUrl
          ? isIOS()
            ? 'iOS 用户建议在 Safari 打开下载'
            : 'Android 用户建议在系统浏览器打开下载'
          : '暂未获取到下载地址，请稍后重试或复制链接后在浏览器打开。'
        setButtonEnabled(elDownloadBtn, !!downloadUrl && !isWechat())
        setButtonEnabled(elCopyBtn, !!downloadUrl)
      }

      elDownloadBtn.addEventListener('click', () => {
        if (!downloadUrl) return
        if (isWechat()) {
          elWechatMask.style.display = 'block'
          return
        }
        openUrl(downloadUrl)
      })

      async function doCopy() {
        if (!downloadUrl) return
        const ok = await copyText(downloadUrl)
        showToast(ok ? '下载链接已复制' : '复制失败')
      }

      elCopyBtn.addEventListener('click', doCopy)
      elMaskCopyBtn.addEventListener('click', doCopy)
      elMaskCloseBtn.addEventListener('click', () => {
        elWechatMask.style.display = 'none'
      })
      elWechatMask.addEventListener('click', (e) => {
        if (e && e.target === elWechatMask) elWechatMask.style.display = 'none'
      })

      ;(async () => {
        if (isWechat()) elWechatMask.style.display = 'block'
        downloadUrl = await fetchDownloadUrl()
        render()
      })()
    </script>
  </body>
</html>
